name: telegram-service-bot

services:
  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telegram_service
      POSTGRES_USER: telegram_service
      POSTGRES_PASSWORD: telegram_service
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - telegram-service-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U telegram_service -d telegram_service]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://telegram_service:telegram_service@database:5432/telegram_service
    ports:
      - 127.0.0.1:${HEALTH_PORT:-8090}:${HEALTH_PORT:-8090}
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  checks:
    profiles: [tools]
    build:
      context: .
      target: checks
    command: [npm, test]

volumes:
  telegram-service-data:
